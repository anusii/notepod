name: Build Installers

# 20241024 gjw Construct bundles for various distributions. The
# bundles (.zip or .exe or .dmg files) are created as artefacts that
# can be downloaded locally using the github command line `gh`. I am
# not utilising github SECRETS yet but will do so to push the packages
# directly to repository and to build signed packages.
#
# 20251017 gjw The dev branch used to be assumed in the naming of
# artefacts below using `${{ github.ref_name }}`. But other branch
# names are then problematic, particularly if the branch name includes
# `/` (our usual practice) and we wanted to skip the `dev` check for
# limiting the builds. For testing build processes in a separate
# branch, named other than `dev` we now use a branch named
# `build`. All `github.ref_name` are replaced with env.RELEASE.
#
# 20251017 jesscmoore Added github secrets for macos signing during
# build and added signing workflow as per
# <https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications>
#
# 20251029 jesscmoore Use flutter flavors to build with separate build
# configurations for app store ('staging' flavor, uses distribution
# certificate) and developer testing ('dev' flavor, uses development
# certificate). Workflows added for building unsigned, signed ('dev'
# and 'staging') macos apps.
# https://docs.flutter.dev/deployment/flavors-ios
#
# 20251018 jesscmoore Added github secrets for ios signing
# and workflow for ios ipa archive.
#
# 20251020 jesscmoore Added IOS development provisioning profile in
# Apple Developer Program to use with manual signing
#
# 20251227 gjw Review and unify the naming scheme across all
# platforms. Remove the -dev- from file names.

on:
  push:
    branches:
      - dev
      - build
      - installers

env:
  APP: notepod
  RELEASE: dev
  LINUX_PKGS: libsecret-1-dev
  MACOS_APP_RELEASE_UNSIGNED_PATH: build/macos/Build/Products/Release-unsigned
  MACOS_APP_RELEASE_STAGING_PATH: build/macos/Build/Products/Release-staging
  MACOS_APP_RELEASE_DEV_PATH: build/macos/Build/Products/Release-dev
  FLUTTER_VERSION: "3.47.5"

jobs:

  ########################################################################
  # LINUX
  #
  # 20250110 gjw Originally I was building on Ubuntu 22.04 since my
  # 24.04 version would not run on Mint 21.3. Then moved even older to
  # Ubuntu 20.04 to get it more widely available. Seems to work on
  # 22.04 and 24.04. Backwards the error was: "rattle:
  # /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.34' not found
  # (required by rattle)" On Ubuntu 20.04 the highest version of GLIBC
  # is GLIBC2.30.
  #
  # 20250311 gjw Support for Ubuntu 20.04 is being deprecated
  # https://github.com/gjwgit/rattleng/actions/runs/13753262146.
  # Move to 22.04 to get broadest deployment.
  #
  # 20251226 gjw I considered combining the build for snap and zip as
  # one job, but the snap build was somewhat independent and didn't
  # work straight away, so keep separate until debugged. Similarly
  # keep the DEB build separate for now, though it will probably work
  # tacked onto the ZIP build. By being separate it is easier to test
  # separately or to build separately as required.

  package-linux-deb:
    if: |
      contains(github.event.head_commit.message, 'bump version') ||
      contains(github.event.head_commit.message, 'build installers') ||
      contains(github.event.head_commit.message, 'build linux') ||
      contains(github.event.head_commit.message, 'build deb')

    runs-on: ubuntu-latest

    steps:

      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install OS Dependencies
        run: |
          sudo apt-get update -y
          printf '#%.0s' {1..72}; printf '\nninja-build\n'
          sudo apt-get install -y ninja-build
          printf '#%.0s' {1..72}; printf '\nlibgtk-3-dev\n'
          sudo apt-get install -y libgtk-3-dev
          printf '#%.0s' {1..72}; printf '\nclang cmake\n'
          sudo apt-get install -y clang cmake

      - name: Install extra Linux packages
        if: env.LINUX_PKGS != ''
        run: |
          printf '#%.0s' {1..72}; printf '\n${{env.LINUX_PKGS}}\n'
          sudo apt-get install -y ${{env.LINUX_PKGS}}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable Linux Build
        run: flutter config --enable-linux-desktop

      - name: Build Flutter Linux app
        run: flutter build linux --release

      # Package as DEB

      - name: Install Packaging Tools
        run: sudo apt-get install -y dpkg-dev fakeroot

      - name: Get Version from pubspec.yaml
        id: vars
        run: |
          VERSION=$(yq eval '.version' pubspec.yaml | sed 's/+.*//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Check the app version number
        run: echo ${VERSION}

      - name: Deb Package
        run: |
          mkdir -p build/${{env.APP}}_${VERSION}_amd64/DEBIAN
          mkdir -p build/${{env.APP}}_${VERSION}_amd64/usr/bin
          mkdir -p build/${{env.APP}}_${VERSION}_amd64/usr/lib/${{env.APP}}
          mkdir -p build/${{env.APP}}_${VERSION}_amd64/usr/share/applications
          mkdir -p build/${{env.APP}}_${VERSION}_amd64/usr/share/icons/hicolor/512x512/apps

          echo "Package: ${{env.APP}}" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Version: ${VERSION}" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Section: utils" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Priority: optional"  >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Architecture: amd64" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Depends: libgtk-3-0, libblkid1, liblzma5" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Maintainer: Graham Williams <graham.williams@togaware.com>" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control
          echo "Description: DESCRIPTION" >> build/${{env.APP}}_${VERSION}_amd64/DEBIAN/control

          echo "[Desktop Entry]" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Name=${{env.APP}}" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Comment=Collect your documents in Pods" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Exec=/usr/bin/${{env.APP}}" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Icon=${{env.APP}}" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Terminal=false" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Type=Application" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop
          echo "Categories=Utility;" >> build/${{env.APP}}_${VERSION}_amd64/usr/share/applications/com.togaware.${{env.APP}}.desktop

          # Copy the built flutter application.

          cp -r build/linux/x64/release/bundle/* build/${{env.APP}}_${VERSION}_amd64/usr/lib/${{env.APP}}/

          # Ensure /usr/bin/${APP} points to the actual executable.

          (cd build/${{env.APP}}_${VERSION}_amd64/usr/bin; ln -s ../lib/${{env.APP}}/${{env.APP}} ${{env.APP}})

          # Copy the app icon which is assumed to be named ${APP}.png
          # in the installers folder.

          cp assets/images/app_icon.png build/${{env.APP}}_${VERSION}_amd64/usr/share/icons/hicolor/512x512/apps/${{env.APP}}.png

          # Set correct permissions.

          chmod -R 755 build/${{env.APP}}_${VERSION}_amd64/DEBIAN
          find build/${{env.APP}}_${VERSION}_amd64/usr -type d -exec chmod 755 {} \;
          find build/${{env.APP}}_${VERSION}_amd64/usr -type f -exec chmod 644 {} \;
          chmod 755 build/${{env.APP}}_${VERSION}_amd64/usr/lib/${{env.APP}}/${{env.APP}}

          # Build the debian package.

          dpkg-deb --build build/${{env.APP}}_${VERSION}_amd64

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-linux-deb
          path: build/${{env.APP}}_${{env.VERSION}}_amd64.deb

  package-linux-zip:
    if: |
      contains(github.event.head_commit.message, 'bump version') ||
      contains(github.event.head_commit.message, 'build installers') ||
      contains(github.event.head_commit.message, 'build linux')

    runs-on: ubuntu-latest

    steps:

      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install OS Dependencies
        run: |
          sudo apt-get update -y
          printf '#%.0s' {1..72}; printf '\nninja-build\n'
          sudo apt-get install -y ninja-build
          printf '#%.0s' {1..72}; printf '\nlibgtk-3-dev\n'
          sudo apt-get install -y libgtk-3-dev
          printf '#%.0s' {1..72}; printf '\nclang cmake\n'
          sudo apt-get install -y clang cmake

      - name: Install extra Linux packages
        if: env.LINUX_PKGS != ''
        run: |
          printf '#%.0s' {1..72}; printf '\n${{env.LINUX_PKGS}}\n'
          sudo apt-get install -y ${{env.LINUX_PKGS}}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable Linux Build
        run: flutter config --enable-linux-desktop

      - name: Build Flutter Linux app
        run: flutter build linux --release

      # Package as ZIP

      - name: Zip Bundle
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: ${{env.APP}}-linux.zip
          directory: build/linux/x64/release/bundle

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-linux-zip
          path: build/linux/x64/release/bundle/${{env.APP}}-linux.zip

  package-linux-snap:
    if: |
      contains(github.event.head_commit.message, 'bump version') ||
      contains(github.event.head_commit.message, 'build installers') ||
      contains(github.event.head_commit.message, 'build linux') ||
      contains(github.event.head_commit.message, 'build snap')

    runs-on: ubuntu-latest

    steps:

      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install OS Dependencies
        run: |
          sudo apt-get update -y

      # 20260311 gjw be sure to add dependencies into the snapcraft
      # file rather than here, including llvm, lld, libsecret-1-dev,
      # libjsoncpp-dev, for flutter_secure_storage

      - name: Install extra Linux packages
        if: env.LINUX_PKGS != ''
        run: |
          printf '#%.0s' {1..72}; printf '\n${{env.LINUX_PKGS}}\n'
          sudo apt-get install -y ${{env.LINUX_PKGS}}

      - name: Build snap
        if: hashFiles('snap/**') != ''
        uses: snapcore/action-build@v1
        id: build

      - name: Upload snap artifact
        if: hashFiles('snap/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-linux-snap
          path: ${{ steps.build.outputs.snap }}

  # publish:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   # Only publish on tag pushes
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   steps:
  #     - name: Download snap artifact
  #       uses: actions/download-artifact@v6
  #       with:
  #         name: snap-package

  #     - name: Publish to Snap Store
  #       uses: snapcore/action-publish@v1
  #       env:
  #         SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
  #       with:
  #         snap: '*.snap'
  #         release: stable

  ########################################################################
  # MACOS - ad-hoc DMG and ZIP, plus notarized DMG and ZIP
  #
  # 20260916 gjw Merged the original (ad-hoc) and notarized jobs into
  # this one. The app is built ONCE and packaged twice: the ad-hoc DMG
  # and ZIP that need no certificates at all, and then, when the
  # Developer ID secrets are present, the notarized DMG and ZIP that
  # install without a Gatekeeper override. Building once halves the
  # macOS minutes, and keeping the ad-hoc artefacts unconditional means
  # an expired certificate or a missing secret still leaves a usable
  # download rather than no macOS build at all.
  #
  # The three jobs that built with --flavor unsigned / staging / dev
  # were deleted here: the app has no flavors (macos/Runner.xcodeproj
  # holds a single Runner scheme and no Release-<flavor> build
  # configurations), and none of their secrets were ever added to this
  # repository, so all three failed at the build step. They came across
  # from notepod. Recover them from git history if the App Store build
  # is revived.

  package-macos:
    env:
      DEVELOPER_ID_APP_CERT_NAME: "Developer ID Application: Togaware Pty Ltd (G7843T3SD3)"
    if: |
      contains(github.event.head_commit.message, 'bump version') ||
      contains(github.event.head_commit.message, 'build installers') ||
      contains(github.event.head_commit.message, 'build macos')

    # 20260809 gjw Was pinned to macos-14 because later images reported
    # "Xcode failed to resolve Swift Package Manager dependencies". The real
    # cause is the opposite of too-new: macos-14 carries Xcode 15.4 (Swift
    # 5.10), and flutter_gemma's Package.swift uses a trailing comma in an
    # argument list, which is Swift 6.1 syntax (SE-0439, Xcode 16.3). Since
    # the Podfile is removed below the build is pure SPM, so every plugin
    # manifest must compile. Hence a current image, with the newest Xcode
    # selected explicitly rather than relying on the image default.

    runs-on: macos-latest

    steps:
      - name: Display OS Information
        run: |
          system_profiler SPSoftwareDataType

      - name: Select the newest Xcode
        # flutter_gemma's manifest needs Swift 6.1 (Xcode 16.3 or later).
        # Chosen by sort order so this does not break when the image's Xcode
        # versions change; the versions are logged to make any future
        # toolchain failure diagnosable from the run alone.
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter create --platforms=macos --org=com.togaware .

      - name: Remove Podfile and project.yaml
        # 20260102 gjw These cause the default basic build to fail as
        # for some reason an older macOS version is targeted.
        run: |
          rm -f macos/Podfile macos/project.yml

      # 20260712 gjw keychain-access-groups is a restricted
      # entitlement that requires a provisioning profile. With ad-hoc
      # signing AMFI kills the app at launch (SIGKILL Code Signature
      # Invalid) even though codesign --verify passes. On the mac you
      # can strip the entitlements with `codesign --force --deep -s -
      # /Applications/mypod.app`. We strip it here for the
      # no-certificate build. Consequence: flutter_secure_storage, as
      # utilised by solidpod utilises, cannot persist to the keychain,
      # so the security key is not cached between sessions, resulting
      # in a "press twice" beahviour rather than remembering it,
      # inherent to no-certificate distribution.
      #
      # 20260916 gjw The Developer ID build strips it too. A restricted
      # entitlement needs an embedded provisioning profile whichever
      # certificate signs the app, and Developer ID distribution
      # normally embeds none, so AMFI refused to launch the notarized
      # 1.0.45 build: Apple's malware check passed and then Finder said
      # "The application mypod.app can't be opened". The array was
      # empty in any case, granting nothing.
      #
      # 20260916 tonypioneer The last sentence of that note used to claim a
      # sandboxed app gets its own default keychain access group from a
      # valid signature. It does not. The default group comes from the
      # com.apple.application-identifier entitlement, which only an
      # embedded provisioning profile supplies, so the notarized 1.0.45
      # DMG had NO keychain at all: flutter_secure_storage failed, and
      # because package:oidc keeps the PKCE code_verifier in that same
      # secure store the code exchange went out without one. The Solid
      # server answered invalid_grant and oidc_core relabelled it as the
      # RFC 9207 "authorization error response is missing the iss
      # parameter" mix-up error - the login failure reported against
      # 1.0.45.
      #
      # The fix is in macos/Runner/Release.entitlements, which no longer
      # enables the sandbox: notarisation only requires the hardened
      # runtime, and an unsandboxed signed app has ordinary keychain
      # access with no entitlement at all. The strip below is now a
      # no-op (neither entitlements file declares the key any more) and
      # is kept only so a re-added array cannot reach a signature.

      - name: Strip restricted entitlements (invalid with ad-hoc signing)
        run: |
          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            if /usr/libexec/PlistBuddy -c "Print :keychain-access-groups" "$f" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$f"
              echo "Removed keychain-access-groups from $f"
            fi
          done

      # 20260814 gjw macos/Runner.xcodeproj is committed with my own
      # signing settings - automatic signing against team G7843T3SD3
      # with an "Apple Development" identity - which the runner cannot
      # satisfy since it holds no certificates:
      #
      #   error: No signing certificate "Mac Development" found
      #
      # flutter passes any FLUTTER_XCODE_<SETTING> environment
      # variable through to xcodebuild as a build setting, and
      # command-line build settings override the project, so we ask
      # for ad-hoc signing ("-") here without touching the project
      # file that Xcode uses on my mac.
      #
      # 20260916 gjw This stays ad-hoc even when the Developer ID
      # certificate is available. The project asks for a Mac App
      # Development provisioning profile, which Developer ID
      # distribution does not use, so Xcode would fail before the
      # certificate was ever consulted. The real signature is applied
      # by the codesign step further below.

      - name: Build Flutter macOS app
        run: flutter build macos --release
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ""

      - name: Note the build location
        run: |
          pwd
          ls -lh build/macos/Build/Products/Release

      # 20260712 gjw Verify the ad-hoc signature Xcode applied during
      # the build. If this fails here it would be SIGKILLed (Code
      # Signature Invalid) on the user's Mac, so fail the build
      # instead.

      - name: Verify macOS app code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/macos/Build/Products/Release/${{env.APP}}.app"

      ####################################################################
      # Package the ad-hoc build. These artefacts are produced whether or
      # not any certificate is available.

      - name: Create DMG Adhoc
        run: |
          mkdir -p dmg_temp
          cp -R "build/macos/Build/Products/Release/${{env.APP}}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{env.APP}}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{env.APP}}-adhoc-macos.dmg"

      - name: Note the DMG created
        run: |
          ls -lh

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-adhoc-macos-dmg
          path: ${{env.APP}}-adhoc-macos.dmg

      # Package as ZIP
      #
      # 20260712 gjw Use ditto rather than zip (thedoctor0/zip-release)
      # here. A .app relies on the symlinks inside its embedded
      # frameworks (FlutterMacOS.framework etc) and plain zip does not
      # preserve them, which breaks the code signature seal and the
      # app is then SIGKILLed (Code Signature Invalid) on launch.
      # ditto preserves symlinks, resource forks and permissions.

      - name: Create ZIP Adhoc
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/${{env.APP}}.app" \
            "${{env.APP}}-adhoc-macos.zip"

      - name: Review ZIP exists
        run: ls -lh ${{env.APP}}-adhoc-macos.zip

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-adhoc-macos-zip
          path: ${{env.APP}}-adhoc-macos.zip

      ####################################################################
      # Developer ID signing and notarisation. Every step below is
      # skipped when the certificate secret is absent, so a fork, or this
      # repository before the secrets were added, still gets the ad-hoc
      # artefacts above instead of a failed build.

      - name: Check for Developer ID signing secrets
        env:
          DEVELOPER_ID_CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT }}
        run: |
          if [ -n "$DEVELOPER_ID_CERT" ]; then
            echo "HAS_DEVELOPER_ID=true" >> $GITHUB_ENV
          else
            echo "HAS_DEVELOPER_ID=false" >> $GITHUB_ENV
            echo "::warning::MACOS_DEVELOPER_ID_CERT is not set - skipping notarisation"
          fi

      # Install the Developer ID Application certificate
      - name: Install Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          DEVELOPER_ID_CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT }}
          DEVELOPER_ID_CERT_PWD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/developer_id.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$DEVELOPER_ID_CERT" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$DEVELOPER_ID_CERT_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # Sign with Developer ID and enable the hardened runtime (--options runtime).
      # The hardened runtime is a mandatory requirement for notarisation.
      - name: Codesign app with hardened runtime
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          DEVELOPER_ID_PROFILE: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE }}
        run: |
          APP="build/macos/Build/Products/Release/${{ env.APP }}.app"

          # 20260916 gjw Sign every nested binary, deepest first. The
          # previous find looked for -type f -name "*.framework", but a
          # framework is a DIRECTORY and the executable inside it has no
          # extension, so nothing matched and the frameworks kept the
          # ad-hoc signature from the build. Apple then rejects the
          # submission because nested code is not signed with the
          # Developer ID certificate.

          # Loose libraries first.

          find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              codesign --force --timestamp --options runtime \
                --sign "$DEVELOPER_ID_APP_CERT_NAME" "$f"
            done

          # Then the nested bundles themselves: -depth signs the
          # innermost first, as codesign requires.

          find "$APP/Contents" -depth \( -name "*.framework" -o -name "*.xpc" -o -name "*.app" \) -print0 2>/dev/null | \
            while IFS= read -r -d '' b; do
              codesign --force --timestamp --options runtime \
                --sign "$DEVELOPER_ID_APP_CERT_NAME" "$b"
            done

          # 20260920 gjw Embed the Developer ID provisioning profile and
          # sign with the keychain entitlements it authorises.
          #
          # macOS gates the data protection keychain, which
          # flutter_secure_storage uses, on the app holding a keychain
          # access group. That group comes from the
          # com.apple.application-identifier entitlement, and only an
          # embedded provisioning profile can authorise it: without one,
          # every keychain call fails with errSecMissingEntitlement
          # (-34018), so the security key and the DPoP key never persist
          # and a POD cannot be initialised. Turning the data protection
          # keychain off in solidpod was not enough, so the profile is now
          # carried in the bundle. The profile must be in place BEFORE the
          # app bundle is signed, since the signature seals it.
          #
          # $(AppIdentifierPrefix) is an Xcode build setting, and codesign
          # does not expand it, so the team prefix is written out in full
          # here. The committed entitlements stay free of these keys: the
          # ad-hoc build above must not carry a restricted entitlement, or
          # AMFI refuses to launch it.

          ENTITLEMENTS=macos/Runner/Release.entitlements

          if [ -n "$DEVELOPER_ID_PROFILE" ]; then
            echo -n "$DEVELOPER_ID_PROFILE" | \
              base64 --decode -o "$APP/Contents/embedded.provisionprofile"

            TEAM_ID=$(echo "$DEVELOPER_ID_APP_CERT_NAME" | sed -E 's/.*\((.*)\)/\1/')
            APP_ID="$TEAM_ID.$(/usr/libexec/PlistBuddy -c \
              'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"

            ENTITLEMENTS=$RUNNER_TEMP/developer_id.entitlements
            cp macos/Runner/Release.entitlements "$ENTITLEMENTS"

            /usr/libexec/PlistBuddy -c \
              "Add :com.apple.application-identifier string $APP_ID" \
              "$ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c \
              "Add :com.apple.developer.team-identifier string $TEAM_ID" \
              "$ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c \
              'Add :keychain-access-groups array' "$ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c \
              "Add :keychain-access-groups:0 string $APP_ID" "$ENTITLEMENTS"

            echo "Signing with the Developer ID profile for $APP_ID"
            /usr/libexec/PlistBuddy -c Print "$ENTITLEMENTS"
          else
            echo "::warning::No MACOS_DEVELOPER_ID_PROFILE secret - signing without a provisioning profile, so the keychain will be unavailable and login will fail"
          fi

          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$DEVELOPER_ID_APP_CERT_NAME" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # 20260916 gjw Show what was actually signed, so a rejected
          # notarisation can be traced to the binary that kept the wrong
          # signature rather than guessing from Apple's log alone.

          codesign --display --verbose=2 "$APP" 2>&1 | grep -i authority || true

          # 20260916 gjw Refuse to ship an app carrying a restricted
          # entitlement with no provisioning profile to authorise it.
          # Notarisation does not check this, so without the guard the
          # failure only shows up as "can't be opened" on a user's Mac.

          if codesign --display --entitlements :- "$APP" 2>/dev/null | \
               grep -q 'keychain-access-groups' && \
             [ ! -f "$APP/Contents/embedded.provisionprofile" ]; then
            echo "::error::Restricted entitlement without a provisioning profile - the app will not launch"
            exit 1
          fi

          # 20260916 And refuse to ship a sandboxed app that has no way
          # to reach the keychain. Without a keychain access group -
          # either declared, or defaulted from the
          # com.apple.application-identifier an embedded profile brings -
          # flutter_secure_storage silently fails, which takes the PKCE
          # code_verifier with it and breaks login. That failure is
          # invisible until someone tries to sign in, so catch it here.

          ENTS=$(codesign --display --entitlements :- "$APP" 2>/dev/null || true)
          if echo "$ENTS" | grep -q 'com.apple.security.app-sandbox' && \
             ! echo "$ENTS" | grep -q 'keychain-access-groups' && \
             [ ! -f "$APP/Contents/embedded.provisionprofile" ]; then
            echo "::error::Sandboxed with no keychain access group and no provisioning profile - flutter_secure_storage will fail and login will break"
            exit 1
          fi

      - name: Create DMG
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          rm -rf dmg_temp
          mkdir -p dmg_temp
          cp -R "build/macos/Build/Products/Release/${{ env.APP }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{ env.APP }}" \
            -srcfolder dmg_temp -ov -format UDZO "${{ env.APP }}-notarized-macos.dmg"

      - name: Sign the DMG
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          codesign --force --timestamp \
            --sign "$DEVELOPER_ID_APP_CERT_NAME" "${{ env.APP }}-notarized-macos.dmg"

      # Notarisation: submit the DMG to Apple; --wait blocks until the result is returned
      - name: Notarize DMG
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          echo -n "$AC_API_KEY" | base64 --decode -o $RUNNER_TEMP/AuthKey.p8

          # 20260916 gjw notarytool submit exits 0 even when Apple
          # rejects the upload, so a failure used to surface later as a
          # cryptic "Record not found" from the stapler. Capture the
          # result, print Apple's own log listing each offending binary,
          # and fail here when the status is not Accepted.

          xcrun notarytool submit "${{ env.APP }}-notarized-macos.dmg" \
            --key $RUNNER_TEMP/AuthKey.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --output-format json | tee $RUNNER_TEMP/notary.json

          SUBMISSION_ID=$(jq -r .id $RUNNER_TEMP/notary.json)
          STATUS=$(jq -r .status $RUNNER_TEMP/notary.json)
          echo "Notarisation $SUBMISSION_ID finished with status: $STATUS"

          xcrun notarytool log "$SUBMISSION_ID" \
            --key $RUNNER_TEMP/AuthKey.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" || true

          test "$STATUS" = "Accepted"

      # Staple the notarisation ticket onto the DMG so it passes Gatekeeper even offline
      #
      # 20260916 gjw Staple the .app as well so the ZIP below carries the
      # ticket too. Apple issues the ticket against the app's cdhash, so
      # this works even though it was the DMG that was submitted. It is a
      # warning rather than a failure: without the ticket the app is
      # still notarized, Gatekeeper just has to ask Apple online.

      - name: Staple ticket
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          xcrun stapler staple "${{ env.APP }}-notarized-macos.dmg"
          xcrun stapler staple "build/macos/Build/Products/Release/${{ env.APP }}.app" || \
            echo "::warning::Could not staple the .app - the ZIP will need an online check"

      - name: Verify Gatekeeper acceptance
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          spctl -a -t open --context context:primary-signature -vvv "${{ env.APP }}-notarized-macos.dmg" || true
          xcrun stapler validate "${{ env.APP }}-notarized-macos.dmg"

      - name: Upload Artefact Notarized DMG
        if: env.HAS_DEVELOPER_ID == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-notarized-macos-dmg
          path: ${{ env.APP }}-notarized-macos.dmg

      - name: Create ZIP
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/${{env.APP}}.app" \
            "${{env.APP}}-notarized-macos.zip"

      - name: Review ZIP exists
        if: env.HAS_DEVELOPER_ID == 'true'
        run: ls -lh ${{env.APP}}-notarized-macos.zip

      - name: Upload Artefact Notarized ZIP
        if: env.HAS_DEVELOPER_ID == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-notarized-macos-zip
          path: ${{env.APP}}-notarized-macos.zip

  ########################################################################
  # IOS

  package-ios-ipa:
    if: |
      contains(github.event.head_commit.message, 'bump version x') ||
      contains(github.event.head_commit.message, 'build installers x') ||
      contains(github.event.head_commit.message, 'build ios')
    runs-on: macos-latest
    env:
      IOS_APP_RELEASE_PATH: build/ios/ipa
      IOS_ARCHIVE_RELEASE_PATH: build/ios/archive

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable iOS
        run: flutter config --enable-ios

      # Install certificate and IOS provisioning profile for app signing

      # iOS entitlements are different to the macOS entitlements
      # so uses a provisioning profile for iOS.
      # The provisioning profile links the signing certificate, Apple
      # developer account and entitlements for the app build.

      - name: Install Apple certificate and IOS provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "Create variables for filepaths for certificate, provisioning profile, and keychain"
          # These vars must be assigned at run time
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "Import certificate and provisioning profile from secrets"
          echo -n "$IOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$IOS_PROVISION_PROFILE" | base64 --decode -o $PP_PATH

          echo "Create temporary keychain"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" $KEYCHAIN_PATH

          echo "Import certificate to keychain"
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          echo "Add apple and apple-tool to partition list for key to allow build codesign to access keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # TODO: make this the save path for the decoded profile
          echo "Save provisioning profile to location expected by Xcode build"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Display temporary keychain
        run: |

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: List installed provisioning profiles
        run: ls -lh ~/Library/MobileDevice/Provisioning\ Profiles

      # Build and sign the app

      - name: Build Flutter iOS app archive
        # By default `ipa` produces a release mode .ipa archived version of
        # .app bundle, with settings tailored for Apple App Store
        # distribution. Use --export-method
        # By default, app is codesigned, unless --no-codesign is used.
        # run: flutter build ipa
        # Option for manual signing
        # Use --verbose to debug build and signing issues
        run: flutter build ipa --export-options-plist=ios/GithubActionsExportOptions.plist

      - name: Note the xcarchive created
        run: |
          ls -lh ${{ env.IOS_ARCHIVE_RELEASE_PATH }}

      - name: Note the IPA created
        run: |
          ls -lh ${{ env.IOS_APP_RELEASE_PATH }}

      - name: Extract IPA
        run: |
          mkdir "${{ env.IOS_APP_RELEASE_PATH }}/extracted_ipa"
          unzip "${{ env.IOS_APP_RELEASE_PATH }}/${{ env.APP }}.ipa" -d "${{ env.IOS_APP_RELEASE_PATH }}/extracted_ipa"

      - name: Check .app bundle extracted from IPA
        # Check app bundle was extracted
        id: check_app
        run: |
          # APP_PATH=$(find "${{ env.IOS_APP_RELEASE_PATH }}/extracted_ipa/Payload" -d -name "*.app" -print -quit)
          # echo "extracted .app path: $APP_PATH"
          if test -d "${{ env.IOS_APP_RELEASE_PATH }}/extracted_ipa/Payload/Runner.app"; then
            echo "IPA extracted to extracted_ipa/Payload/Runner.app."
            echo "APP_EXTRACTED=true" >> $GITHUB_OUTPUT
          else
            echo ".app bundle not extracted from IPA."
            echo "APP_EXTRACTED=false" >> $GITHUB_OUTPUT
          fi

      - name: Check IPA code signature
        # Ensure an app bundle was extracted
        if: steps.check_app.outputs.APP_EXTRACTED == 'true'
        run: |
          codesign --display --verbose=2 "${{ env.IOS_APP_RELEASE_PATH }}/extracted_ipa/Payload/Runner.app"

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-ipa
          path: ${{ env.IOS_APP_RELEASE_PATH }}/${{ env.APP }}.ipa

      # # Important! Cleanup: remove the certificate and provisioning profile from the runner!
      # - name: Clean up keychain and provisioning profile
      #   if: ${{ always() }}
      #   run: |
      #     security delete-keychain $KEYCHAIN_PATH
      #     rm ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      # 20251018 jesscmoore:
      # If ipa not distributed through the app store or enterprise MDM
      # users will asked to trust developer in iOS settings during
      # the install:
      # https://help.apple.com/xcode/mac/current/#/dev96a12fb84

      # 20251020 jesscmoore:
      # Using a "development" certificate and associated
      # provisioning profile
      # and "debugging" export method
      # may limit installation to only devices
      # registered in the Apple Developer Program
      # account.
      # Use a "distribution" certificate and associated
      # provisioning profile and "ad-hoc" export method for
      # testing on devices that don't need to be registered
      # on Apple Develop Program account.
      # The distribution certificate and associated
      # provisioning profile can be used with app-store export
      # method.

  ########################################################################
  # WINDOWS

  package-windows-zip-exe:
    if: |
      contains(github.event.head_commit.message, 'bump version') ||
      contains(github.event.head_commit.message, 'build installers') ||
      contains(github.event.head_commit.message, 'build windows')

    # The windows-latest was not working for some instances so resort
    # to windows-2022

    runs-on: windows-2022

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Flutter Windows app
        run: flutter build windows --release

      # Package as ZIP

      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: ${{env.APP}}-windows.zip
          directory: build/windows/x64/runner/Release

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-windows-zip
          path: build/windows/x64/runner/Release/${{env.APP}}-windows.zip

      # Package as EXE

      - name: Check the DLLs for Inclusion in the .iss script
        run: dir D:\a\${{ env.APP }}\${{ env.APP }}\build\windows\x64\runner\Release\

      - name: Get Version from pubspec.yaml
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:[^^]*' | ForEach-Object { $_.ToString().Split(":")[1].Trim().Split("+")[0].Trim() })
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: installers/app-windows.iss
          options: /O+

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-windows-inno
          path: D:\a\${{env.APP}}\${{env.APP}}\installers\installers\${{env.APP}}-windows-inno.exe
