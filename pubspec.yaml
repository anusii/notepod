name: notepod
description: "Privacy preserving note taking app using PODs."
publish_to: "none"
version: 0.2.13+6

environment:
  sdk: ">=3.2.3 <4.0.0"

# To automatically upgrade package dependencies:
#
# `flutter pub upgrade --major-versions`.
#
# To see which dependencies have newer versions available:
#
# `flutter pub outdated`.
#
# (gjw 20250429)

dependencies:
  flutter:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.14
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  dart_jsonwebtoken: ^3.1.1
  encrypt: ^5.0.3
  fast_rsa: ^3.4.7
  flutter_form_builder: ^10.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0-beta.4
  flutter_svg: ^2.0.5
  flutter_typeahead: ^5.2.0
  form_builder_validators: ^11.1.2
  http: ^1.1.2
  jwt_decoder: ^2.0.1
  loading_indicator: ^3.1.1
  markdown_editor_plus: ^0.2.15
  markdown_toolbar: ^0.5.0
  markdown_widget: ^2.3.2+8
  multi_select_flutter: ^4.1.3
  openid_client: ^0.4.8
  package_info_plus: ^8.3.0
  pointycastle: ^3.7.3
  rdf_core: ^0.9.2
  rdflib: ^0.2.12
  rename: ^3.1.0
  solidpod: ^0.6.9
  solid_encrypt: ^0.1.10
  universal_io: ^2.2.2
  url_launcher: ^6.2.1
  version_widget: ^1.0.2
  window_manager: ^0.5.0

# Define launcher icons for all platforms (except Linux) so icons for
# the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`
#
# (gjw 20250429)

  intl: any
flutter_launcher_icons:
  image_path: "assets/images/notepod.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48

dev_dependencies:
  flutter_test:
    sdk: flutter

  import_order_lint:
    git:
      url: https://github.com/anusii/import-order-lint.git
      ref: main

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/types/
